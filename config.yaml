# Quill configuration: the single source of truth for all parameters (quill_config.CFG).

audio:
  sr: 44100          # 44.1 kHz / mono processing
  mono: true
  norm_peak: 0.97    # target peak for automatic gain normalisation

f0:
  step_size_ms: 10.0       # PESTO CQT frame step, 100 Hz frame rate
  pesto_model: mir-1k_g7   # PESTO default weights
  conf_threshold: 0.6      # low-confidence frame filter; f0 octave errors often come with a conf drop
  octave_tol_cents: 50.0   # a median deviation between primary/fallback f0 above this counts as an octave error
  pyin_fmin: 55.0          # A1
  pyin_fmax: 2000.0

harmonic:
  n_harmonics: 60          # H_env[60, T]
  n_fft: 4096              # STFT window length
  hop: 512                 # STFT hop, about 86.13 Hz frame rate
  search_cents: 30.0       # per-harmonic peak search half-window (McAulay-Quatieri 1986)
  quasi_search_cents: 80.0 # wider window for quasi-harmonic sources (wine glass/bowl)
  low_f0_nfft_threshold: 100.0  # when f0 is below this, n_fft is raised to low_f0_nfft
  low_f0_nfft: 8192
  nyquist_margin_hz: 50.0  # harmonics within this margin of Nyquist are truncated

synth:
  # the synthesis side shares sr/hop/n_harmonics with harmonic; only synthesis-specific items go here
  fade_above_nyquist: true # not read by the engine; for the soft fade-out width of harmonics above Nyquist see runtime.nyquist_ramp_hz
  humanize_cents: 6.0      # micro pitch jitter, removes static mechanical feel
  humanize_amp: 0.05       # micro amplitude tremor (shimmer)

# ---- Real-time engine ----
runtime:
  blocksize: 256           # sd.OutputStream block size (latency budget = 256/44100 ≈ 5.8 ms)
  max_voices: 16
  channels: 1
  noise_level: 0.5         # per-voice noise-side mix ratio
  attack_fade_ms: 20.0     # harmonic fade-in overlap (overlaps attack grain playback)
  steal_fade_ms: 4.0       # fast fade-out on voice stealing (3–5 ms)
  nyquist_ramp_hz: 600.0   # gain soft fade-out width for harmonics crossing Nyquist
  attack_grain_table_s: 2.0  # precomputed noise table length (seconds)

adsr:                      # linear-segment ADSR, stage duration error within ±10%
  attack_ms: 8.0
  decay_ms: 120.0
  sustain: 0.7
  release_ms: 180.0

velocity:                  # velocity mapping
  loud_exp: 1.5            # loud = (vel/127)^1.5
  tilt_db_oct: 6.0         # tilt = -(1 - vel/127) * tilt_db_oct  (dB/oct brightness tilt)

# ---- Articulation classification: all thresholds adjustable ----
articulation:
  strum_window_ms: 80      # onset gap threshold within one window
  strum_min_onsets: 3      # ≥3 onsets in the same window -> strum
  slide_slope_cents_s: 500 # |net f0 slope| > this -> slide (1 semitone/100 ms ≈ 1000, 500 leaves margin)
  slide_min_dur_ms: 60     # minimum slide duration
  slide_monotonic_frac: 0.70  # a true slide has a monotonic f0 track; requires the same-direction step fraction > this
                              # (filters out fake slides from PESTO octave jumps/inter-note noise with large but non-monotonic slopes)
  min_event_ms: 30         # isolated events shorter than this are dropped as fragments (not within strum clusters)
  legato_max_gap_ms: 60    # legato is only possible when the gap to the previous note is < this
  legato_pitch_jump_max_st: 7   # legato interval cap (beyond it is more like an independent attack/slide)
  pluck_attack_ms: 25      # log_attack < log10(0.025) -> fast attack (main pluck criterion)
  pluck_centroid_hz: 1200  # and centroid > this -> pluck (plucks in the low register have a low centroid, so the threshold cannot be higher)
  vibrato_rate_lo: 4.0     # vibrato rate window (Hz); a hit -> sustain+vibrato (extracted before judging slide)
  vibrato_rate_hi: 8.0
  pluck_rms_buckets: 3     # number of RMS buckets for pluck grains (Roads 2001 granular)

# ---- Gesture interpreter: MIDI gestures -> articulations ----
gesture:
  legato_max_st: 2         # overlapping-key interval ≤ this -> legato; > this -> slide
  slide_dur_ms: 130        # base slide duration (higher velocity is faster)
  slide_dur_min_ms: 50
  legato_dur_ms: 40        # legato fast-glide duration
  strum_spread_ms: 14      # base per-string strum offset (higher velocity is tighter)
  vibrato_max_cents: 50    # vibrato depth at CC1=127
  vibrato_onset_ms: 110    # vibrato onset delay, clean tone first, then vibrato
  vibrato_ramp_ms: 220     # smoothstep fade-in time of the vibrato depth
