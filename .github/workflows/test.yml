name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest tests -q -m "not slow"

  test-nojit:
    runs-on: ubuntu-latest
    env:
      QUILL_NO_JIT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Test (numpy fallback, no JIT)
        run: pytest tests -q -m "not slow"
